name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装检查工具
        run: pip install ruff pytest aiohttp
      - name: 代码检查
        run: ruff check .
      - name: 格式检查
        run: ruff format --check .
      - name: 运行测试
        run: python -m pytest -q
